name: Validate LNG BOR Model

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate workbook
        run: python generate_bor_model.py

      - name: Validate workbook
        run: python validate_model.py

      - name: Upload workbook artifact
        uses: actions/upload-artifact@v4
        with:
          name: LNG_BOR_Model
          path: LNG_BOR_Model.xlsx
